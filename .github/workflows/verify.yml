name: Verify CertCity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_CERTCITY_RELEASE: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check assessment, content, and archived evidence
        run: npm run check:claude
      - name: Check that practice questions can't be answered by test-taking cues
        run: node scripts/check-item-quality.cjs --enforce
      - name: Check exam guide decisions can't be answered by test-taking cues
        run: npm run check:guide
      - name: Check city routes, daily shifts and today's work
        run: npm run check:city
      - name: Check progress recovery and conflict handling
        run: node scripts/check-progress-recovery.cjs
      - name: Check study reminder emails match the current labs and links
        run: npm run check:notifications
      - name: Build the Next.js application
        run: npm run build
      - name: Check the exported SEO metadata and crawl paths
        run: npm run check:seo
